# Wait seven days before installing newly published dependency versions.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Upstream tooling still requests majors affected by cancellation / pattern DoS.
overrides:
  'glob@>=9.0.0 <14.0.2': 14.0.6
  'minimatch@>=7.0.0 <11.0.1': 11.0.9
